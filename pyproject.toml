[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xml2rel"
version = "0.1.0"
description = "Declarative XML-to-relational extraction engine with DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xml2rel contributors" }]
keywords = ["xml", "xpath", "duckdb", "etl", "relational"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "lxml>=5.0",
  "duckdb>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.20",
]

[project.scripts]
xml2rel = "xml2rel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
